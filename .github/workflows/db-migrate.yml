name: Automated Database Schema Sync

on:
  push:
    branches:
      - main
    paths:
      - "schema.sql"
      - "migrations/**"
      - "scripts/db-auto.js"
  workflow_dispatch:

jobs:
  migrate-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply automated PostgreSQL migrations (if token configured)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret not set yet — skipping CI cloud migration."
            exit 0
          fi
          node scripts/db-auto.js migrate
